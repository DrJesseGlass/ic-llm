[workspace]
members = [
    "src/qwen3_backend"
]
resolver = "2"

[patch.crates-io]
getrandom = { git = "https://github.com/DrJesseGlass/getrandom", tag = "determinism-0.3.0.4" }

# Redirect crates.io candle 0.11 to the fork branch carrying the lazy quantized
# embedding, the wasm32 serial matmul path, and the smaller-footprint/streaming
# loader (smaller-wasm-footprint is stacked on wasm-browser-perf). Both this backend
# and ic-dev-kit-rs
# v0.1.0 declare candle from crates.io (^0.11), so patching at the crates.io source
# unifies them onto one candle-core; without it the two consumers resolve to
# different candle revisions and the gguf Content type no longer matches from_gguf.
# The fork branch is itself versioned 0.11.0, so it satisfies the ^0.11 requirement.
# The relaxed-simd kernel on this branch is cfg-gated on +relaxed-simd, which the IC
# build never sets, so it is excluded from the wasm.
candle-core = { git = "https://github.com/DrJesseGlass/candle", branch = "smaller-wasm-footprint" }
candle-nn = { git = "https://github.com/DrJesseGlass/candle", branch = "smaller-wasm-footprint" }
candle-transformers = { git = "https://github.com/DrJesseGlass/candle", branch = "smaller-wasm-footprint" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"