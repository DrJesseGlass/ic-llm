build_cmd: cargo build --release --target wasm32-unknown-unknown -p qwen3_backend --features canbench-rs

wasm_path: ./target/wasm32-unknown-unknown/release/qwen3_backend.wasm

stable_memory:
  # Raw all-Q4_K GGUF (341,455,328 bytes) loaded at offset 0; must match MODEL_SIZE
  # in canbench_benchmarks.rs. Large + gitignored, so download before benchmarking:
  #   huggingface-cli download DrJesseGlass/Qwen3-0.6B-Q4_K Qwen3-0.6B-allq4k-f16src.gguf \
  #     --local-dir src/qwen3_backend/benchmark-assets
  file: ./src/qwen3_backend/benchmark-assets/Qwen3-0.6B-allq4k-f16src.gguf